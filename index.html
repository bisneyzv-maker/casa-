<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Rural El Refugio</title>
    <style>
        :root { --verde: #2d5a27; --crema: #fdfaf5; --marron: #5d4037; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--crema); color: #333; }
        
        header { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1200') no-repeat center/cover; color: white; height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        
        .container { max-width: 900px; margin: auto; padding: 40px 20px; }
        
        .galeria { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .galeria img { width: 100%; height: 250px; object-fit: cover; border-radius: 15px; transition: 0.3s; }
        .galeria img:hover { transform: scale(1.03); }

        .botones { text-align: center; margin: 50px 0; }
        .btn { padding: 18px 35px; border-radius: 50px; text-decoration: none; font-weight: bold; margin: 10px; display: inline-block; transition: 0.3s; }
        .btn-reserva { background: var(--verde); color: white; box-shadow: 0 4px 15px rgba(45,90,39,0.3); }
        .btn-whatsapp { background: #25d366; color: white; }
        .btn:hover { transform: translateY(-3px); filter: brightness(1.1); }

        .mapa { border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-top: 30px; }
        iframe { width: 100%; height: 450px; border: 0; }
        
        footer { text-align: center; padding: 40px; background: var(--marron); color: white; }
    </style>
</head>
<body>

<header>
    <h1 style="font-size: 3.5rem; margin-bottom: 10px;">Casa Rural "El Refugio"</h1>
    <p style="font-size: 1.2rem;">Tu rincón de paz en plena naturaleza</p>
</header>

<div class="container">
    <h2>Nuestros Rincones</h2>
    <div class="galeria">
        <img src="https://images.unsplash.com/photo-1518780664697-55e3ad937233?auto=format&fit=crop&w=600" alt="Exterior">
        <img src="https://images.unsplash.com/photo-1542718610-a1d656d1884c?auto=format&fit=crop&w=600" alt="Interior">
        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=600" alt="Vistas">
    </div>

    <div class="botones">
        <a href="mailto:info@tuemail.com" class="btn btn-reserva">RESERVAR POR EMAIL</a>
        <a href="https://wa.me/34600000000" class="btn btn-whatsapp">HABLAR POR WHATSAPP</a>
    </div>

    <h2>¿Dónde estamos?</h2>
    <div class="mapa">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d194348.1398111979!2d-3.819620684742702!3d40.41436383049187!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd422997800a3c81%3A0xc436dec1618c2269!2sMadrid!5e0!3m2!1ses!2ses!4v1710000000000!5m2!1ses!2ses" allowfullscreen="" loading="lazy"></iframe>
    </div>
</div>

<footer>
    <p>Casa Rural El Refugio © 2026<br>Calle de la Montaña s/n, Asturias</p>
</footer>

</body>
</html>
