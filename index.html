<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Rural - Reservas</title>
    <style>
        :root { --primary: #4a6741; --secondary: #f4f1ea; --accent: #d4a373; }
        body { font-family: sans-serif; margin: 0; background-color: var(--secondary); color: #333; }
        
        /* Galería */
        .gallery { display: flex; flex-wrap: wrap; gap: 10px; padding: 20px; justify-content: center; }
        .gallery img { width: 300px; height: 200px; object-fit: cover; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

        /* Botones */
        .actions { text-align: center; padding: 30px; }
        .btn { padding: 15px 25px; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; margin: 10px; transition: 0.3s; }
        .btn-book { background: var(--primary); color: white; }
        .btn-wa { background: #25d366; color: white; }
        .btn:hover { opacity: 0.8; transform: translateY(-2px); }

        /* Mapa */
        .map-container { max-width: 800px; margin: 20px auto; border-radius: 15px; overflow: hidden; border: 5px solid white; }
        iframe { width: 100%; height: 400px; border: 0; }
    </style>
</head>
<body>

    <h1 style="text-align: center; margin-top: 20px;">Escapada Rural Premium</h1>

    <!-- Sección Fotos -->
    <div class="gallery">
        <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=500" alt="Paisaje">
        <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=500" alt="Montaña">
        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?q=80&w=500" alt="Casa">
    </div>

    <!-- Sección Botones -->
    <div class="actions">
        <a href="#" class="btn btn-book">RESERVAR AHORA</a>
        <a href="https://wa.me/XXXXXXXXXXX" class="btn btn-wa">WHATSAPP DIRECTO</a>
    </div>

    <!-- Sección Google Maps -->
    <div class="map-container">
        <!-- Sustituye este iframe por el que te da Google Maps en "Compartir > Insertar mapa" -->
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d12692.4412345678!2d-3.70379!3d40.416775!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd422997800a3c81%3A0xc436dec1618c2269!2sMadrid!5e0!3m2!1ses!2ses!4v1620000000000" allowfullscreen="" loading="lazy"></iframe>
    </div>

</body>
</html>
